# ─────────────────────────────────────────────────────────────
#  Nginx reverse proxy configuration for Trading Bot
#  - Terminates TLS (certificates managed by Certbot/Let's Encrypt)
#  - Routes /api/* and /ws to the FastAPI backend
#  - Routes everything else to the Streamlit frontend
#  - Applies rate limiting and security hardening
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;    # hide Nginx version

    # ── Compression ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate Limiting Zones ───────────────────────────────────
    # Default: 10 req/s per IP
    limit_req_zone  $binary_remote_addr zone=default:10m  rate=10r/s;
    # Auth endpoints: stricter — 1 req/s per IP
    limit_req_zone  $binary_remote_addr zone=auth:10m     rate=1r/s;
    # API general: 5 req/s per IP
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=5r/s;

    # ── Connection Limiting ───────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Upstream Services ─────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream streamlit_frontend {
        server frontend:8501;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name theapextraders.com;

        # ── TLS certificates (managed by Certbot) ─────────────
        ssl_certificate     /etc/letsencrypt/live/theapextraders.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/theapextraders.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/theapextraders.com/chain.pem;

        # ── TLS hardening ──────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # ── Security Headers ──────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                        always;
        add_header X-Content-Type-Options    "nosniff"                                     always;
        add_header X-XSS-Protection          "1; mode=block"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"    always;

        # ── General limits ────────────────────────────────────
        client_max_body_size 10M;
        limit_conn addr 20;

        # ── Auth endpoints (strict rate limit) ────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── API endpoints ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # ── Health probes (no rate limit) ─────────────────────
        location ~ ^/(health|ready)$ {
            proxy_pass http://api_backend;
            access_log off;
        }

        # ── WebSocket ─────────────────────────────────────────
        location /ws {
            proxy_pass              http://api_backend;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade    $http_upgrade;
            proxy_set_header        Connection "upgrade";
            proxy_set_header        Host       $host;
            proxy_set_header        X-Real-IP  $remote_addr;
            proxy_read_timeout      3600s;   # keep WS alive for 1hr
            proxy_send_timeout      3600s;
        }

        # ── Streamlit Dashboard (everything else) ─────────────
        location / {
            limit_req zone=default burst=30 nodelay;
            proxy_pass         http://streamlit_frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Streamlit WebSocket ────────────────────────────────
        location /_stcore/stream {
            proxy_pass              http://streamlit_frontend;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade    $http_upgrade;
            proxy_set_header        Connection "upgrade";
            proxy_set_header        Host       $host;
            proxy_read_timeout      3600s;
        }

        # ── Block common attack paths ─────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 444;
        }
        location ~ /\. {
            deny all;
        }
    }
}
