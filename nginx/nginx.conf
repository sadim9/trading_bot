# ─────────────────────────────────────────────────────────────
#  Nginx reverse proxy configuration for Trading Bot
#  - Terminates TLS (certificates managed by Certbot/Let's Encrypt)
#  - Routes /api/* and /ws to the FastAPI backend
#  - Routes everything else to the Streamlit frontend
#  - Applies rate limiting and security hardening
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout       75;
    keepalive_requests      1000;
    client_body_timeout     60s;
    client_header_timeout   60s;
    send_timeout            60s;
    types_hash_max_size 2048;
    server_tokens      off;    # hide Nginx version

    # ── Compression ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml application/xml+rss text/javascript;

    # ── Rate Limiting Zones ───────────────────────────────────
    # Default: 10 req/s per IP
    limit_req_zone  $binary_remote_addr zone=default:10m  rate=10r/s;
    # Auth endpoints: stricter — 1 req/s per IP
    limit_req_zone  $binary_remote_addr zone=auth:10m     rate=1r/s;
    # API general: 5 req/s per IP
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=5r/s;

    # ── Connection Limiting ───────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Docker internal DNS resolver ──────────────────────────
    # Forces nginx to re-resolve upstream hostnames dynamically
    # instead of caching IPs at startup — prevents 502 after
    # container rebuilds change the upstream IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Upstream Services ─────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream streamlit_frontend {
        server frontend:8501;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 75s;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://theapextraders.com$request_uri;
        }
    }

    # ── www → apex redirect (HTTPS) ───────────────────────────
    # Mobile browsers (iOS Safari, Android Chrome) commonly request
    # www.theapextraders.com.  Without this block they hit a TLS cert
    # mismatch (cert only covers the apex domain) and cannot connect at all.
    server {
        listen 443 ssl http2;
        server_name www.theapextraders.com;

        ssl_certificate     /etc/letsencrypt/live/theapextraders.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/theapextraders.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/theapextraders.com/chain.pem;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        return 301 https://theapextraders.com$request_uri;
    }

    # ── HTTPS main server ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name theapextraders.com;

        # ── TLS certificates (managed by Certbot) ─────────────
        ssl_certificate     /etc/letsencrypt/live/theapextraders.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/theapextraders.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/theapextraders.com/chain.pem;

        # ── TLS hardening ──────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # ── Security Headers ──────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                  always;
        add_header X-Content-Type-Options    "nosniff"                                     always;
        add_header X-XSS-Protection          "1; mode=block"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"    always;

        # ── General limits ────────────────────────────────────
        client_max_body_size 10M;
        limit_conn addr 100;

        # ── Auth endpoints (strict rate limit) ────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── API endpoints ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
        }

        # ── Health probes (no rate limit) ─────────────────────
        location ~ ^/(health|ready)$ {
            proxy_pass http://api_backend;
            access_log off;
        }

        # ── WebSocket ─────────────────────────────────────────
        location /ws {
            proxy_pass              http://api_backend;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        "upgrade";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_read_timeout      3600s;   # keep WS alive for 1hr
            proxy_send_timeout      3600s;
        }

        # ── Streamlit static assets (versioned hashes — never cache) ──
        # Streamlit rebuilds /static/ on every restart with new content hashes.
        # If browsers cache the old hash references they get a 404 on preload,
        # producing "Unable to preload CSS for .../static/css/DataFrame.xxx.css".
        # Fix: tell browsers to ALWAYS revalidate so new hashes are picked up
        # immediately. No rate limit — these are tiny, infrequent asset fetches.
        location ~* ^/static/ {
            proxy_pass         http://streamlit_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Retry on stale keepalive connections (e.g. after frontend restart)
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            proxy_read_timeout 60s;
        }

        # ── Streamlit component library files ────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
        location ~* ^/component/ {
            proxy_pass         http://streamlit_frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # ── Streamlit Dashboard (everything else) ─────────────────────────────────────────────────────────
        location / {
            limit_req zone=default burst=200 nodelay;
            proxy_pass         http://streamlit_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Clear Connection header so keep-alive works correctly through proxy
            proxy_set_header   Connection        "";
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            proxy_connect_timeout  15s;
            # Streamlit uses chunked transfer / SSE — buffering must be OFF
            # or the browser receives nothing and shows a blank page.
            proxy_buffering       off;
            # Never cache the main HTML — it contains hashed JS/CSS filenames
            # that change on every Streamlit restart. Stale HTML = 503 on assets.
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ── Streamlit WebSocket ────────────────────────────────
        # IMPORTANT: X-Forwarded-Proto MUST be passed so Streamlit
        # knows to advertise wss:// (secure WebSocket) to the browser.
        # Without it, the browser receives a ws:// URL from an https://
        # page and blocks it as mixed content — this is the root cause
        # of login and form interactions failing on mobile devices.
        location /_stcore/stream {
            proxy_pass              http://streamlit_frontend;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        "upgrade";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # ── Streamlit health endpoint ─────────────────────────────────────────────────────────────────────────────────────────────────
        location /_stcore/health {
            proxy_pass http://streamlit_frontend;
            access_log off;
        }

        # ── Block common attack paths ─────────────────────────────────────────────────────────────────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 444;
        }
        location ~ /\. {
            deny all;
        }
    }
}
