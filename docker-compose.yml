###############################################################
#  Trading Bot — Docker Compose (Production)
#
#  Services:
#    db        — PostgreSQL 16 (persistent data)
#    redis     — Redis 7 (sessions, rate-limit, caching)
#    api       — FastAPI backend
#    worker    — Background bot signal worker
#    frontend  — Streamlit dashboard
#    nginx     — Reverse proxy + TLS termination
#
#  Usage:
#    cp .env.example .env && nano .env
#    docker compose up -d
###############################################################

# ── Shared network ────────────────────────────────────────────
networks:
  trading_net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  certbot_www:
  # Shared log directory — trade CSV + signal logs visible to all services
  trading_logs:


services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # DO NOT expose port 5432 externally — internal network only


  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis_pw}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme_redis_pw}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-changeme_redis_pw}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # api port NOT exposed externally — accessed via Nginx only
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M


  # ── Bot Worker ───────────────────────────────────────────────
  worker:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-changeme_redis_pw}@redis:6379/0
    volumes:
      - trading_logs:/app/logs          # shared with frontend so trades are visible
    depends_on:
      api:
        condition: service_healthy
    networks:
      - trading_net


  # ── Streamlit Frontend ───────────────────────────────────────
  frontend:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000/api/v1
    volumes:
      - trading_logs:/app/logs          # reads trade CSV written by worker
    depends_on:
      api:
        condition: service_healthy
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M


  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3


  # ── Certbot (Let's Encrypt — runs once then exits) ────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - nginx_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    networks:
      - trading_net
